<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AdSnap AI - Ultimate Pro Banner Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #ec4899;
      --accent: #38bdf8;
      --bg-dark: #07090e;
      --card-bg: rgba(13, 19, 32, 0.95);
      --border-glow: rgba(99, 102, 241, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .studio-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-glow);
      backdrop-filter: blur(20px);
    }
    .header { text-align: center; margin-bottom: 20px; }
    .badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-size: 10px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .header h1 { margin: 0; font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #818cf8, #ec4899, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
    
    .control-box { margin-bottom: 14px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.5px; }
    select, input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: all 0.3s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
    select option { background: #0f172a; color: #fff; }

    .upload-zone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      padding: 16px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .upload-zone:hover { background: rgba(255, 255, 255, 0.06); border-color: var(--primary); }

    .preview-screen {
      width: 100%;
      height: 320px;
      background: #020617;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

    .download-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .download-btn:active { transform: scale(0.98); opacity: 0.9; }
  </style>
</head>
<body>

  <div class="studio-container">
    <div class="header">
      <div class="badge">✨ Max Level Pro Studio</div>
      <h1>AdSnap AI Engine</h1>
      <p>Instant Commercial Banner Generation</p>
    </div>

    <div class="control-box">
      <label>Select Banner Template Category</label>
      <select id="categorySelect">
        <option value="realestate">🏠 Real Estate & Property Showcase</option>
        <option value="ecommerce">🔥 Mega Discount & Flash Sale</option>
        <option value="festival">🎉 Grand Festival Celebration</option>
      </select>
    </div>

    <label class="upload-zone" for="imageUpload">
      <span>📷 Tap to Upload Project / Product Photo</span>
    </label>
    <input type="file" id="imageUpload" accept="image/*" style="display:none;">

    <div class="control-box">
      <label>Main Headline / Offer Text</label>
      <input type="text" id="headlineInput" value="LUXURY 3 BHK APARTMENT | SPECIAL OFFER">
    </div>

    <div class="preview-screen">
      <canvas id="masterCanvas" width="1080" height="1080"></canvas>
    </div>

    <button class="download-btn" id="downloadMasterBtn">📥 Download High-Res Banner</button>
  </div>

  <script>
    const imageUpload = document.getElementById('imageUpload');
    const headlineInput = document.getElementById('headlineInput');
    const categorySelect = document.getElementById('categorySelect');
    const canvas = document.getElementById('masterCanvas');
    const ctx = canvas.getContext('2d');
    const downloadMasterBtn = document.getElementById('downloadMasterBtn');

    let currentImage = null;

    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          currentImage = new Image();
          currentImage.onload = () => renderBanner();
          currentImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    headlineInput.addEventListener('input', renderBanner);
    categorySelect.addEventListener('change', renderBanner);

    function renderBanner() {
      const w = canvas.width;
      const h = canvas.height;
      const category = categorySelect.value;

      // Dynamic Theme Color Mapping
      let grad1 = '#0f172a', grad2 = '#1e1b4b', accentColor = '#6366f1';
      if (category === 'ecommerce') { grad1 = '#7c2d12'; grad2 = '#431407'; accentColor = '#f97316'; }
      else if (category === 'festival') { grad1 = '#701a75'; grad2 = '#4a044e'; accentColor = '#ec4899'; }

      // 1. Background Gradient
      const bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, grad1);
      bgGrad.addColorStop(1, grad2);
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Realistic Background Radial Glow
      const glow = ctx.createRadialGradient(w/2, h/2 - 100, 50, w/2, h/2 - 100, w/1.2);
      glow.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
      glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      // 3. Image Rendering with Professional Frame
      if (currentImage) {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 15;

        const maxW = w * 0.82;
        const maxH = h * 0.55;
        const hRatio = maxW / currentImage.width;
        const vRatio = maxH / currentImage.height;
        const ratio = Math.min(hRatio, vRatio);
        const imgW = currentImage.width * ratio;
        const imgH = currentImage.height * ratio;
        const shiftX = (w - imgW) / 2;
        const shiftY = 100;

        // Image Container Border
        ctx.beginPath();
        ctx.roundRect(shiftX - 10, shiftY - 10, imgW + 20, imgH + 20, 24);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Draw Image
        ctx.drawImage(currentImage, 0, 0, currentImage.width, currentImage.height, shiftX, shiftY, imgW, imgH);
        ctx.restore();
      } else {
        // Fallback Placeholder Box if no image uploaded
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.beginPath();
        ctx.roundRect(w * 0.1, 100, w * 0.8, h * 0.52, 24);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 28px Outfit, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("📷 Upload Image to Preview", w / 2, 380);
        ctx.restore();
      }

      // 4. Glassmorphism Footer Overlay for Text & Branding
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 30;
      ctx.shadowOffsetY = -10;

      const footerGrad = ctx.createLinearGradient(0, h - 300, 0, h);
      footerGrad.addColorStop(0, 'rgba(15, 23, 42, 0.85)');
      footerGrad.addColorStop(1, 'rgba(7, 9, 14, 0.98)');
      ctx.fillStyle = footerGrad;
      ctx.beginPath();
      ctx.roundRect(40, h - 310, w - 80, 260, 32);
      ctx.fill();

      ctx.strokeStyle = accentColor;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      // 5. Category Badge Inside Banner
      ctx.save();
      ctx.fillStyle = accentColor;
      ctx.font = '900 22px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(category.toUpperCase() + " SPECIAL", w / 2, h - 250);

      // 6. Main Headline Text Auto-Wrapping
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 44px Outfit, sans-serif';
      ctx.textAlign = 'center';
      const text = headlineInput.value.toUpperCase() || "PREMIUM QUALITY BANNER";
      wrapText(ctx, text, w / 2, h - 190, w - 140, 54);
      ctx.restore();
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          context.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, currentY);
    }

    downloadMasterBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'AdSnap-Max-Level-Banner.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Initial render call
    renderBanner();
  </script>
</body>
</html>
