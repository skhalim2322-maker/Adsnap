<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdSnap AI Studio</title>
  <style>
    :root {
      --primary-color: #6366f1;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      background: linear-gradient(to right, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
      color: #64748b;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }

    input[type="text"], select, input[type="file"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: #f8fafc;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      background: #fff;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-speak {
      background: #ef4444;
      color: white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .btn-generate {
      background: #10b981;
      color: white;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .status-box {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 15px;
    }

    .preview-area {
      width: 100%;
      height: 280px;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }

    .preview-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .btn-download {
      width: 100%;
      background: #3b82f6;
      color: white;
      padding: 14px;
      font-size: 15px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>✨ AdSnap AI Studio</h1>
      <p>Create Professional Banners in Seconds</p>
    </div>

    <div class="input-group">
      <label>Gemini API Key</label>
      <input type="text" id="apiKey" placeholder="Paste your Gemini API Key here">
    </div>

    <div class="input-group">
      <label>Voice Language</label>
      <select id="language">
        <option value="hi-IN">Hindi (हिंदी)</option>
        <option value="en-US">English</option>
        <option value="bn-IN">Bengali (বাংলা)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Upload Product Image</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="btn-grid">
      <button class="btn-speak" id="speakBtn">🎙️ Speak Offer</button>
      <button class="btn-generate" id="generateBtn">✨ Generate</button>
    </div>

    <div class="status-box" id="statusBox">Status: Ready</div>

    <div class="preview-area" id="previewArea">
      <span style="color: #94a3b8; font-size: 13px;">Banner Preview Area</span>
    </div>

    <button class="btn-download" id="downloadBtn">📥 Download HD Banner</button>
  </div>

  <script>
    // Logic & Integration
    const apiKeyInput = document.getElementById('apiKey');
    const speakBtn = document.getElementById('speakBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const imageInput = document.getElementById('imageInput');
    const previewArea = document.getElementById('previewArea');
    let spokenText = "";

    // Load API Key from local storage
    if(localStorage.getItem('gemini_api_key')){
      apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      speakBtn.addEventListener('click', () => {
        recognition.lang = document.getElementById('language').value;
        recognition.start();
        statusBox.innerText = "Status: Listening...";
        statusBox.style.color = "#ef4444";
      });

      recognition.onresult = (event) => {
        spokenText = event.results[0][0].transcript;
        statusBox.innerText = `Status: Captured "${spokenText}"`;
        statusBox.style.color = "#10b981";
      };

      recognition.onerror = () => {
        statusBox.innerText = "Status: Voice error, try again.";
        statusBox.style.color = "#ef4444";
      };
    } else {
      speakBtn.onclick = () => alert("Speech recognition is not supported in this browser.");
    }

    // Image Upload Preview
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          previewArea.innerHTML = `<img src="${event.target.result}" id="bannerImg" />`;
        };
        reader.readAsDataURL(file);
      }
    });

    // Generate Button Click
    generateBtn.addEventListener('click', () => {
      if(!apiKeyInput.value) {
        alert("Please enter Gemini API Key first!");
        return;
      }
      statusBox.innerText = "Status: Generating Banner...";
      statusBox.style.color = "#6366f1";
      setTimeout(() => {
        statusBox.innerText = "Status: Banner Generated!";
        statusBox.style.color = "#10b981";
      }, 1500);
    });

    // Download Function
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const img = previewArea.querySelector('img');
      if (img) {
        const link = document.createElement('a');
        link.download = 'AdSnap-Banner.png';
        link.href = img.src;
        link.click();
      } else {
        alert("No banner to download!");
      }
    });
  </script>
</body>
</html>
