<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AdSnap AI - Pro Realistic Studio Ultimate 5.0</title>
  
  <meta name="theme-color" content="#060913">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AdSnap Pro">
  
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #8b5cf6;
      --secondary: #ec4899;
      --accent: #38bdf8;
      --app-gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #38bdf8 100%);
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #090d16 100%);
      --card-bg: rgba(15, 23, 42, 0.9);
      --border-glow: rgba(139, 92, 246, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: thin;
      scrollbar-color: var(--primary) transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .studio-wrapper {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-glow);
      position: relative;
      overflow: hidden;
    }

    .studio-wrapper::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 200px;
      height: 200px;
      background: var(--primary);
      filter: blur(100px);
      opacity: 0.25;
      z-index: 0;
    }

    .studio-wrapper::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -80px;
      width: 200px;
      height: 200px;
      background: var(--secondary);
      filter: blur(100px);
      opacity: 0.2;
      z-index: 0;
    }

    .header-section {
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .badge-pro {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 30px;
      margin-bottom: 10px;
      border: 1px solid rgba(139, 92, 246, 0.3);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .header-section h1 {
      margin: 0;
      font-size: 26px;
      background: var(--app-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .header-section p {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Tab Navigation */
    .studio-tabs {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      background: rgba(139, 92, 246, 0.25);
      color: #fff;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.2);
    }

    .tab-content {
      display: none;
      position: relative;
      z-index: 1;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .styled-select, .styled-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      outline: none;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .styled-select:focus, .styled-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
      background: rgba(255, 255, 255, 0.07);
    }

    .styled-select option {
      background: #0f172a;
      color: #fff;
    }

    /* Slider styling */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .styled-range {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .slider-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      width: 35px;
      text-align: right;
    }

    /* Action Dock */
    .action-dock {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .dock-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .dock-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .mic-active {
      background: rgba(239, 68, 68, 0.85) !important;
      border-color: #ef4444 !important;
      animation: micPulse 1.2s infinite;
    }

    @keyframes micPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .text-input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
    }

    .text-input-field::placeholder {
      color: var(--text-muted);
    }

    .generate-action-btn {
      background: var(--app-gradient);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: transform 0.2s ease;
    }

    .generate-action-btn:active {
      transform: scale(0.9);
    }

    .status-display {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 14px;
      background: rgba(56, 189, 248, 0.08);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      position: relative;
      z-index: 1;
    }

    .canvas-preview-container {
      width: 100%;
      height: 260px;
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .download-cta-btn {
      width: 100%;
      background: var(--app-gradient);
      color: white;
      padding: 14px;
      font-size: 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
      transition: opacity 0.2s ease, transform 0.2s ease;
      position: relative;
      z-index: 1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .download-cta-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .media-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.3);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      color: #f472b6;
      margin-bottom: 12px;
      font-weight: 700;
    }

    /* Sticker Grid */
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .sticker-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s ease;
    }

    .sticker-item:hover {
      background: rgba(139, 92, 246, 0.25);
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="studio-wrapper">
    <div class="header-section">
      <div class="badge-pro">✨ Realistic Studio Ultimate 5.0</div>
      <h1>AdSnap AI Pro</h1>
      <p>Voice & Image Powered Pro Realistic Banner Generator</p>
    </div>

    <!-- Tabs -->
    <div class="studio-tabs">
      <button class="tab-btn active" onclick="switchTab('mainTab', this)">Studio</button>
      <button class="tab-btn" onclick="switchTab('designTab', this)">Design</button>
      <button class="tab-btn" onclick="switchTab('filtersTab', this)">Filters</button>
      <button class="tab-btn" onclick="switchTab('stickersTab', this)">Stickers</button>
    </div>

    <!-- TAB 1: MAIN -->
    <div id="mainTab" class="tab-content active">
      <div class="control-group">
        <label class="control-label">Voice Language Selection</label>
        <select id="language" class="styled-select">
          <option value="hi-IN">🇮🇳 Hindi (हिन्दी)</option>
          <option value="en-US">🇺🇸 English (US)</option>
          <option value="bn-IN">🇧🇩 Bengali (বাংলা)</option>
          <option value="gu-IN">🇮🇳 Gujarati (ગુજરાતી)</option>
        </select>
      </div>
    </div>

    <!-- TAB 2: DESIGN -->
    <div id="designTab" class="tab-content">
      <div class="control-group">
        <label class="control-label">Banner Format / Ratio</label>
        <select id="aspectRatio" class="styled-select">
          <option value="1:1">Square Post (1080 x 1080)</option>
          <option value="16:9">YouTube Thumbnail (1280 x 720)</option>
          <option value="9:16">Story / Reel (1080 x 1920)</option>
        </select>
      </div>
      <div class="control-group">
        <label class="control-label">Background Theme Gradient</label>
        <select id="bgTheme" class="styled-select">
          <option value="midnight">Midnight Purple (Default)</option>
          <option value="sunset">Neon Sunset Orange</option>
          <option value="cyber">Cyberpunk Matrix Green</option>
          <option value="royal">Royal Gold & Black</option>
        </select>
      </div>
    </div>

    <!-- TAB 3: FILTERS -->
    <div id="filtersTab" class="tab-content">
      <div class="control-group">
        <label class="control-label">Image Brightness</label>
        <div class="slider-container">
          <input type="range" id="brightnessRange" class="styled-range" min="50" max="150" value="100">
          <span class="slider-val" id="brightnessVal">100%</span>
        </div>
      </div>
      <div class="control-group">
        <label class="control-label">Contrast Adjustment</label>
        <div class="slider-container">
          <input type="range" id="contrastRange" class="styled-range" min="50" max="150" value="100">
          <span class="slider-val" id="contrastVal">100%</span>
        </div>
      </div>
    </div>

    <!-- TAB 4: STICKERS -->
    <div id="stickersTab" class="tab-content">
      <label class="control-label">Tap to add realistic badges/stickers</label>
      <div class="sticker-grid">
        <div class="sticker-item" onclick="addSticker('🔥')">🔥</div>
        <div class="sticker-item" onclick="addSticker('⭐')">⭐</div>
        <div class="sticker-item" onclick="addSticker('💯')">💯</div>
        <div class="sticker-item" onclick="addSticker('💎')">💎</div>
        <div class="sticker-item" onclick="addSticker('🚀')">🚀</div>
        <div class="sticker-item" onclick="addSticker('👑')">👑</div>
        <div class="sticker-item" onclick="addSticker('🎯')">🎯</div>
        <div class="sticker-item" onclick="addSticker('⚡')">⚡</div>
      </div>
    </div>

    <div class="media-badge" id="imageBadge">
      📷 <span>Image Successfully Loaded & Ready</span>
    </div>

    <div class="action-dock">
      <label for="imageInput" class="dock-btn" title="Upload Photo">➕</label>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">

      <input type="text" class="text-input-field" id="offerTextInput" placeholder="Type offer or tap mic...">

      <button class="dock-btn" id="speakBtn" title="Voice Input">🎙️</button>
      <button class="generate-action-btn" id="generateBtn" title="Generate Banner">➔</button>
    </div>

    <div class="status-display" id="statusBox">Status: Studio Initialized & Ready</div>

    <div class="canvas-preview-container" id="previewArea">
      <span style="color: var(--text-muted); font-size: 12px; font-weight: 600;" id="placeholderText">Your Realistic HD Banner Preview Will Appear Here</span>
      <canvas id="bannerCanvas" style="display:none;"></canvas>
    </div>

    <button class="download-cta-btn" id="downloadBtn">📥 Download High-Res Realistic Banner</button>
  </div>

  <script>
    // Tab Switching Logic
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Slider UI bindings
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessVal = document.getElementById('brightnessVal');
    brightnessRange.addEventListener('input', (e) => {
      brightnessVal.innerText = e.target.value + '%';
    });

    const contrastRange = document.getElementById('contrastRange');
    const contrastVal = document.getElementById('contrastVal');
    contrastRange.addEventListener('input', (e) => {
      contrastVal.innerText = e.target.value + '%';
    });

    let activeStickers = [];
    function addSticker(emoji) {
      if(!activeStickers.includes(emoji)) {
        activeStickers.push(emoji);
        document.getElementById('statusBox').innerText = `Status: Added sticker ${emoji}`;
        generateBtn.click();
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.claim());
          self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    const speakBtn = document.getElementById('speakBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const imageInput = document.getElementById('imageInput');
    const imageBadge = document.getElementById('imageBadge');
    const offerTextInput = document.getElementById('offerTextInput');
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');
    const placeholderText = document.getElementById('placeholderText');
    
    let uploadedImage = null;

    offerTextInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        generateBtn.click();
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      speakBtn.addEventListener('click', () => {
        recognition.lang = document.getElementById('language').value;
        recognition.start();
        statusBox.innerText = "Status: Listening to your voice...";
        speakBtn.classList.add('mic-active');
      });

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        offerTextInput.value = text;
        statusBox.innerText = `Status: Captured "${text}"`;
        speakBtn.classList.remove('mic-active');
        generateBtn.click();
      };

      recognition.onerror = () => {
        statusBox.innerText = "Status: Voice recognition error, please type.";
        speakBtn.classList.remove('mic-active');
      };

      recognition.onend = () => {
        speakBtn.classList.remove('mic-active');
      };
    } else {
      speakBtn.onclick = () => alert("Voice input not supported in this browser.");
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedImage = new Image();
          uploadedImage.onload = () => {
            imageBadge.style.display = 'inline-flex';
            statusBox.innerText = "Status: Image loaded successfully";
            generateBtn.click();
          };
          uploadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function drawRealisticBadge(ctx, text, x, y) {
      ctx.font = 'bold 13px Outfit, sans-serif';
      const textWidth = ctx.measureText(text).width;
      const paddingX = 18;
      const paddingY = 8;
      const width = textWidth + paddingX * 2;
      const height = 32;

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.beginPath();
      ctx.roundRect(x - width / 2, y - height / 2, width, height, 16);
      ctx.fill();

      ctx.strokeStyle = 'rgba(236, 72, 153, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#f472b6';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
    }

    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          ctx.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, currentY);
    }

    async function renderBanner() {
      const ratio = document.getElementById('aspectRatio').value;
      let width = 600, height = 600;
      if(ratio === '16:9') { width = 800; height = 450; }
      else if(ratio === '9:16') { width = 450; height = 800; }

      canvas.width = width;
      canvas.height = height;

      // Theme Gradient Background
      const theme = document.getElementById('bgTheme').value;
      const grad = ctx.createLinearGradient(0, 0, width, height);
      if(theme === 'sunset') {
        grad.addColorStop(0, '#7c2d12'); grad.addColorStop(0.5, '#431407'); grad.addColorStop(1, '#18181b');
      } else if(theme === 'cyber') {
        grad.addColorStop(0, '#064e3b'); grad.addColorStop(0.5, '#022c22'); grad.addColorStop(1, '#090d16');
      } else if(theme === 'royal') {
        grad.addColorStop(0, '#78350f'); grad.addColorStop(0.5, '#451a03'); grad.addColorStop(1, '#0f172a');
      } else {
        grad.addColorStop(0, '#0f172a'); grad.addColorStop(0.5, '#1e1b4b'); grad.addColorStop(1, '#3b0764');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Realistic Radial Glow
      const radialGlow = ctx.createRadialGradient(width/2, height/2 - 50, 20, width/2, height/2 - 50, width/1.5);
      radialGlow.addColorStop(0, 'rgba(139, 92, 246, 0.3)');
      radialGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = radialGlow;
      ctx.fillRect(0, 0, width, height);

      if (uploadedImage) {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 10;

        const maxImgW = width * 0.7;
        const maxImgH = height * 0.55;
        const hRatio = maxImgW / uploadedImage.width;
        const vRatio = maxImgH / uploadedImage.height;
        const imgRatio = Math.min(hRatio, vRatio);
        const imgW = uploadedImage.width * imgRatio;
        const imgH = uploadedImage.height * imgRatio;
        const centerShift_x = (width - imgW) / 2;
        const centerShift_y = (height - imgH) / 2 - 30;

        ctx.beginPath();
        ctx.roundRect(centerShift_x - 6, centerShift_y - 6, imgW + 12, imgH + 12, 16);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.fill();

        ctx.drawImage(uploadedImage, 0, 0, uploadedImage.width, uploadedImage.height,
                      centerShift_x, centerShift_y, imgW, imgH);
        ctx.restore();
      } else {
        drawRealisticBadge(ctx, "✨ PREMIUM QUALITY BANNER", width / 2, height / 2 - 40);
      }

      // Draw Stickers
      if(activeStickers.length > 0) {
        ctx.font = '28px sans-serif';
        let startX = width / 2 - (activeStickers.length * 20);
        activeStickers.forEach((st, idx) => {
          ctx.fillText(st, startX + (idx * 40), 60);
        });
      }

      // Glassmorphism Footer Box
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = -5;

      const footerGrad = ctx.createLinearGradient(0, height - 160, 0, height);
      footerGrad.addColorStop(0, 'rgba(15, 23, 42, 0.85)');
      footerGrad.addColorStop(1, 'rgba(30, 27, 75, 0.95)');
      ctx.fillStyle = footerGrad;
      ctx.beginPath();
      ctx.roundRect(24, height - 150, width - 48, 126, 22);
      ctx.fill();

      ctx.strokeStyle = 'rgba(139, 92, 246, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      const userInput = offerTextInput.value.trim() || "LIMITED TIME SPECIAL OFFER";
      const finalBannerText = userInput.toUpperCase();

      // Realistic Text Styling
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      
      drawWrappedText(ctx, finalBannerText, width / 2, height - 90, width - 80, 28);
      ctx.restore();

      placeholderText.style.display = 'none';
      canvas.style.display = 'block';
    }

    generateBtn.addEventListener('click', async () => {
      statusBox.innerText = "Status: Rendering Realistic HD Banner...";
      setTimeout(async () => {
        await renderBanner();
        statusBox.innerText = "Status: Realistic Banner Ready! 🎉";
      }, 300);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (canvas.style.display !== 'none') {
        const link = document.createElement('a');
        link.download = 'AdSnap-Realistic-Ultimate-Banner.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        alert("Pehle kuch offer likho ya photo upload karke ➔ button dabao!");
      }
    });
  </script>
</body>
</html>
