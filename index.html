<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AdSnap AI</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AdSnap AI">
  
  <!-- Inline Manifest -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"AdSnap AI","short_name":"AdSnap","start_url":"./","display":"standalone","background_color":"#090d16","theme_color":"#6366f1","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/1088/1088537.png","sizes":"512x512","type":"image/png"}]}'>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #171c30 100%);
      --card-bg: rgba(20, 24, 38, 0.9);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .settings-icon {
      position: absolute;
      top: 22px;
      right: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: #fff;
    }

    .settings-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(45deg);
    }

    .settings-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 14px;
      padding: 0 16px;
    }

    .settings-panel.active {
      max-height: 120px;
      opacity: 1;
      padding: 16px;
      margin-bottom: 20px;
    }

    .hero-banner {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }

    .ai-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .hero-banner h1 {
      margin: 0;
      font-size: 26px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .hero-banner p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    input[type="password"], select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    select option {
      background: #0f172a;
      color: #fff;
    }

    /* Gemini-Style Smart Prompt Bar */
    .smart-prompt-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      transition: border-color 0.3s;
    }

    .smart-prompt-box:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .prompt-icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .prompt-icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }

    .prompt-input::placeholder {
      color: var(--text-muted);
    }

    .btn-send {
      background: var(--primary-gradient);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .image-preview-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #818cf8;
      margin-bottom: 10px;
    }

    .status-box {
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: #38bdf8;
      margin-bottom: 16px;
      background: rgba(56, 189, 248, 0.08);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.15);
    }

    .preview-area {
      width: 100%;
      height: 250px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .btn-download {
      width: 100%;
      background: var(--primary-gradient);
      color: white;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }

    .btn-download:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-icon" id="settingsToggle" title="Settings">⚙️</button>

    <div class="hero-banner">
      <div class="ai-badge">🚀 Premium AI Edition</div>
      <h1>AdSnap AI</h1>
      <p>Transform voice & images into banners</p>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="input-group" style="margin-bottom: 0;">
        <label>App Access Key</label>
        <input type="password" id="apiKey" placeholder="Enter Access Key">
      </div>
    </div>

    <div class="input-group">
      <label>Voice Language</label>
      <select id="language">
        <option value="hi-IN">Hindi (हिंदी)</option>
        <option value="en-US">English</option>
        <option value="bn-IN">Bengali (বাংলা)</option>
      </select>
    </div>

    <!-- Image Attachment Indicator -->
    <div class="image-preview-badge" id="imageBadge">
      📷 <span>Image Attached</span>
    </div>

    <!-- Gemini Style Smart Prompt Bar -->
    <div class="smart-prompt-box">
      <!-- Plus Icon (Upload File) -->
      <label for="imageInput" class="prompt-icon-btn" title="Upload Image">➕</label>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">

      <!-- Text Input -->
      <input type="text" class="prompt-input" id="offerTextInput" placeholder="Type or speak offer...">

      <!-- Mic Icon -->
      <button class="prompt-icon-btn" id="speakBtn" title="Speak Offer">🎙️</button>

      <!-- Send / Generate Arrow Button -->
      <button class="btn-send" id="generateBtn" title="Generate Banner">➔</button>
    </div>

    <div class="status-box" id="statusBox">Status: Ready</div>

    <div class="preview-area" id="previewArea">
      <span style="color: var(--text-muted); font-size: 13px;" id="placeholderText">Banner Preview Area</span>
      <canvas id="bannerCanvas" style="display:none;"></canvas>
    </div>

    <button class="btn-download" id="downloadBtn">📥 Download HD Banner</button>
  </div>

  <script>
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('active');
    });

    const apiKeyInput = document.getElementById('apiKey');
    const speakBtn = document.getElementById('speakBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const imageInput = document.getElementById('imageInput');
    const imageBadge = document.getElementById('imageBadge');
    const offerTextInput = document.getElementById('offerTextInput');
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');
    const placeholderText = document.getElementById('placeholderText');
    
    let uploadedImage = null;

    if(localStorage.getItem('gemini_api_key')){
      apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      speakBtn.addEventListener('click', () => {
        recognition.lang = document.getElementById('language').value;
        recognition.start();
        statusBox.innerText = "Status: Listening...";
        speakBtn.style.background = "rgba(239, 68, 68, 0.4)";
      });

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        offerTextInput.value = text;
        statusBox.innerText = `Status: Captured "${text}"`;
        speakBtn.style.background = "rgba(255, 255, 255, 0.1)";
      };

      recognition.onerror = () => {
        statusBox.innerText = "Status: Voice error, try typing.";
        speakBtn.style.background = "rgba(255, 255, 255, 0.1)";
      };
    } else {
      speakBtn.onclick = () => alert("Voice input not supported on this browser.");
    }

    // Image Upload
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedImage = new Image();
          uploadedImage.onload = () => {
            imageBadge.style.display = 'inline-flex';
            statusBox.innerText = "Status: Image Attached";
          };
          uploadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Render Canvas
    function renderBanner() {
      canvas.width = 600;
      canvas.height = 600;

      const grad = ctx.createLinearGradient(0, 0, 600, 600);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 600, 600);

      if (uploadedImage) {
        const hRatio = 380 / uploadedImage.width;
        const vRatio = 380 / uploadedImage.height;
        const ratio = Math.min(hRatio, vRatio);
        const centerShift_x = (600 - uploadedImage.width * ratio) / 2;
        const centerShift_y = (380 - uploadedImage.height * ratio) / 2 + 20;

        ctx.drawImage(uploadedImage, 0, 0, uploadedImage.width, uploadedImage.height,
                      centerShift_x, centerShift_y, uploadedImage.width * ratio, uploadedImage.height * ratio);
      }

      ctx.fillStyle = 'rgba(99, 102, 241, 0.9)';
      ctx.fillRect(0, 460, 600, 140);

      const offerText = offerTextInput.value.trim() || "SPECIAL OFFER";
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px Poppins, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(offerText, 300, 530);

      placeholderText.style.display = 'none';
      canvas.style.display = 'block';
    }

    generateBtn.addEventListener('click', () => {
      if(!apiKeyInput.value) {
        alert("Please enter App Access Key in Settings (⚙️) first!");
        settingsPanel.classList.add('active');
        return;
      }
      statusBox.innerText = "Status: Generating Banner...";
      setTimeout(() => {
        renderBanner();
        statusBox.innerText = "Status: Banner Ready!";
      }, 800);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (canvas.style.display !== 'none') {
        const link = document.createElement('a');
        link.download = 'AdSnap-Banner.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        alert("Please attach image or enter offer & click ➔ first!");
      }
    });
  </script>
</body>
</html>
