<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdSnap AI Studio</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #171c30 100%);
      --card-bg: rgba(20, 24, 38, 0.9);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .settings-icon {
      position: absolute;
      top: 22px;
      right: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .settings-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(45deg);
    }

    /* Settings Panel */
    .settings-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 14px;
      padding: 0 16px;
    }

    .settings-panel.active {
      max-height: 120px;
      opacity: 1;
      padding: 16px;
      margin-bottom: 20px;
    }

    /* Hero Banner */
    .hero-banner {
      text-align: center;
      margin-bottom: 25px;
      padding-top: 10px;
    }

    .ai-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .hero-banner h1 {
      margin: 0;
      font-size: 26px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .hero-banner p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    input[type="password"], select, input[type="file"] {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      font-size: 14px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    input[type="password"]:focus, select:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    select option {
      background: #0f172a;
      color: #fff;
    }

    input[type="file"]::file-selector-button {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      margin-right: 10px;
      transition: background 0.2s;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    button.action-btn {
      padding: 13px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.action-btn:active {
      transform: scale(0.96);
    }

    .btn-speak {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-generate {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .status-box {
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #38bdf8;
      margin-bottom: 16px;
      background: rgba(56, 189, 248, 0.08);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.15);
    }

    .preview-area {
      width: 100%;
      height: 260px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .preview-area img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .btn-download {
      width: 100%;
      background: var(--primary-gradient);
      color: white;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }

    .btn-download:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Settings Button -->
    <button class="settings-icon" id="settingsToggle" title="Settings">⚙️</button>

    <!-- AI Studio Hero Banner -->
    <div class="hero-banner">
      <div class="ai-badge">✨ Powered by Gemini AI</div>
      <h1>AdSnap Studio</h1>
      <p>Transform your voice & images into stunning banners</p>
    </div>

    <!-- Hidden Settings Panel for API Key -->
    <div class="settings-panel" id="settingsPanel">
      <div class="input-group" style="margin-bottom: 0;">
        <label>Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Paste your API Key here">
      </div>
    </div>

    <div class="input-group">
      <label>Voice Language</label>
      <select id="language">
        <option value="hi-IN">Hindi (हिंदी)</option>
        <option value="en-US">English</option>
        <option value="bn-IN">Bengali (বাংলা)</option>
      </select>
    </div>

    <div class="input-group">
      <label>Upload Product Image</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="btn-grid">
      <button class="action-btn btn-speak" id="speakBtn">🎙️ Speak Offer</button>
      <button class="action-btn btn-generate" id="generateBtn">✨ Generate</button>
    </div>

    <div class="status-box" id="statusBox">Status: Ready</div>

    <div class="preview-area" id="previewArea">
      <span style="color: var(--text-muted); font-size: 13px;">Banner Preview Area</span>
    </div>

    <button class="btn-download" id="downloadBtn">📥 Download HD Banner</button>
  </div>

  <script>
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('active');
    });

    const apiKeyInput = document.getElementById('apiKey');
    const speakBtn = document.getElementById('speakBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const imageInput = document.getElementById('imageInput');
    const previewArea = document.getElementById('previewArea');
    let spokenText = "";

    if(localStorage.getItem('gemini_api_key')){
      apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      speakBtn.addEventListener('click', () => {
        recognition.lang = document.getElementById('language').value;
        recognition.start();
        statusBox.innerText = "Status: Listening...";
      });

      recognition.onresult = (event) => {
        spokenText = event.results[0][0].transcript;
        statusBox.innerText = `Status: Captured "${spokenText}"`;
      };

      recognition.onerror = () => {
        statusBox.innerText = "Status: Voice error, try again.";
      };
    } else {
      speakBtn.onclick = () => alert("Speech recognition is not supported.");
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          previewArea.innerHTML = `<img src="${event.target.result}" />`;
        };
        reader.readAsDataURL(file);
      }
    });

    generateBtn.addEventListener('click', () => {
      if(!apiKeyInput.value) {
        alert("Please set your Gemini API Key in Settings (⚙️) first!");
        settingsPanel.classList.add('active');
        return;
      }
      statusBox.innerText = "Status: Generating Banner...";
      setTimeout(() => {
        statusBox.innerText = "Status: Banner Generated!";
      }, 1500);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const img = previewArea.querySelector('img');
      if (img) {
        const link = document.createElement('a');
        link.download = 'AdSnap-Banner.png';
        link.href = img.src;
        link.click();
      } else {
        alert("No banner to download!");
      }
    });
  </script>
</body>
</html>
