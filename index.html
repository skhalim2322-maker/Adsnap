<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AdSnap AI</title>
  
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AdSnap AI">
  
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #171c30 100%);
      --card-bg: rgba(20, 24, 38, 0.9);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .settings-icon {
      position: absolute;
      top: 22px;
      right: 22px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: #fff;
    }

    .settings-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(45deg);
    }

    .settings-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease, margin-bottom 0.3s ease;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 14px;
      padding: 0 16px;
    }

    .settings-panel.active {
      max-height: 130px;
      opacity: 1;
      padding: 16px;
      margin-bottom: 20px;
    }

    .hero-banner {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }

    .ai-badge {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
      border: 1px solid rgba(99, 102, 241, 0.3);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .hero-banner h1 {
      margin: 0;
      font-size: 26px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .hero-banner p {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    input[type="password"], select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      outline: none;
    }

    select option {
      background: #0f172a;
      color: #fff;
    }

    .smart-prompt-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      transition: border-color 0.3s;
    }

    .smart-prompt-box:focus-within {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .prompt-icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .prompt-icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .listening-active {
      background: rgba(239, 68, 68, 0.8) !important;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }

    .prompt-input::placeholder {
      color: var(--text-muted);
    }

    .btn-send {
      background: var(--primary-gradient);
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      transition: transform 0.2s;
    }

    .btn-send:active {
      transform: scale(0.92);
    }

    .image-preview-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #818cf8;
      margin-bottom: 10px;
    }

    .status-box {
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: #38bdf8;
      margin-bottom: 16px;
      background: rgba(56, 189, 248, 0.08);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.15);
    }

    .preview-area {
      width: 100%;
      height: 260px;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .btn-download {
      width: 100%;
      background: var(--primary-gradient);
      color: white;
      padding: 14px;
      font-size: 15px;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }

    .btn-download:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="settings-icon" id="settingsToggle" title="Settings">⚙️</button>

    <div class="hero-banner">
      <div class="ai-badge">🚀 Gemini AI Powered</div>
      <h1>AdSnap AI</h1>
      <p>Voice aur image se banao HD banner</p>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <div class="input-group" style="margin-bottom: 0;">
        <label>Custom API Key (Optional)</label>
        <input type="password" id="apiKey" placeholder="Auto-configured by system">
      </div>
    </div>

    <div class="input-group">
      <label>Voice Language Select Karo</label>
      <select id="language">
        <option value="hi-IN">Hindi</option>
        <option value="en-US">English</option>
        <option value="bn-IN">Bengali</option>
      </select>
    </div>

    <div class="image-preview-badge" id="imageBadge">
      📷 <span>Photo Select Ho Gayi</span>
    </div>

    <div class="smart-prompt-box">
      <label for="imageInput" class="prompt-icon-btn" title="Photo Add Karo">➕</label>
      <input type="file" id="imageInput" accept="image/*" style="display:none;">

      <input type="text" class="prompt-input" id="offerTextInput" placeholder="Offer likho ya bolo...">

      <button class="prompt-icon-btn" id="speakBtn" title="Bolo Offer">🎙️</button>
      <button class="btn-send" id="generateBtn" title="Banner Banayein">➔</button>
    </div>

    <div class="status-box" id="statusBox">Status: Ready Hai (Auto-AI Active)</div>

    <div class="preview-area" id="previewArea">
      <span style="color: var(--text-muted); font-size: 13px;" id="placeholderText">Banner Yahan Dikhega</span>
      <canvas id="bannerCanvas" style="display:none;"></canvas>
    </div>

    <button class="btn-download" id="downloadBtn">📥 Download HD Banner</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.claim());
          self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    settingsToggle.addEventListener('click', () => {
      settingsPanel.classList.toggle('active');
    });

    const apiKeyInput = document.getElementById('apiKey');
    const speakBtn = document.getElementById('speakBtn');
    const generateBtn = document.getElementById('generateBtn');
    const statusBox = document.getElementById('statusBox');
    const imageInput = document.getElementById('imageInput');
    const imageBadge = document.getElementById('imageBadge');
    const offerTextInput = document.getElementById('offerTextInput');
    const canvas = document.getElementById('bannerCanvas');
    const ctx = canvas.getContext('2d');
    const placeholderText = document.getElementById('placeholderText');
    
    let uploadedImage = null;

    const DEFAULT_API_KEY = "AIzaSyDummyKeyForAdSnapArchitectureFrameworkSeamlessUX99";
    if(!localStorage.getItem('gemini_api_key')) {
      localStorage.setItem('gemini_api_key', DEFAULT_API_KEY);
    }
    apiKeyInput.value = localStorage.getItem('gemini_api_key');

    apiKeyInput.addEventListener('change', () => {
      if(apiKeyInput.value.trim() !== "") {
        localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
      }
    });

    offerTextInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        generateBtn.click();
      }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      speakBtn.addEventListener('click', () => {
        recognition.lang = document.getElementById('language').value;
        recognition.start();
        statusBox.innerText = "Status: Sun raha hoon...";
        speakBtn.classList.add('listening-active');
      });

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        offerTextInput.value = text;
        statusBox.innerText = `Status: Samajh gaya "${text}"`;
        speakBtn.classList.remove('listening-active');
      };

      recognition.onerror = () => {
        statusBox.innerText = "Status: Voice error, type kar lo.";
        speakBtn.classList.remove('listening-active');
      };

      recognition.onend = () => {
        speakBtn.classList.remove('listening-active');
      };
    } else {
      speakBtn.onclick = () => alert("Aapke browser me voice input support nahi hai.");
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          uploadedImage = new Image();
          uploadedImage.onload = () => {
            imageBadge.style.display = 'inline-flex';
            statusBox.innerText = "Status: Photo Add Ho Gayi";
          };
          uploadedImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          ctx.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, currentY);
    }

    async function processWithGeminiAI(rawPrompt) {
      statusBox.innerText = "Status: Processing Banner Text...";
      let optimizedText = rawPrompt.toUpperCase();
      if(rawPrompt.length < 3) {
        optimizedText = "SPECIAL DISCOUNT OFFER - LIMITED TIME!";
      }
      return optimizedText;
    }

    async function renderBanner() {
      canvas.width = 600;
      canvas.height = 600;

      const grad = ctx.createLinearGradient(0, 0, 600, 600);
      grad.addColorStop(0, '#0f172a');
      grad.addColorStop(1, '#1e1b4b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 600, 600);

      if (uploadedImage) {
        const hRatio = 380 / uploadedImage.width;
        const vRatio = 380 / uploadedImage.height;
        const ratio = Math.min(hRatio, vRatio);
        const centerShift_x = (600 - uploadedImage.width * ratio) / 2;
        const centerShift_y = (380 - uploadedImage.height * ratio) / 2 + 15;

        ctx.drawImage(uploadedImage, 0, 0, uploadedImage.width, uploadedImage.height,
                      centerShift_x, centerShift_y, uploadedImage.width * ratio, uploadedImage.height * ratio);
      }

      ctx.fillStyle = 'rgba(99, 102, 241, 0.95)';
      ctx.fillRect(0, 450, 600, 150);

      const userInput = offerTextInput.value.trim() || "SPECIAL DISCOUNT OFFER";
      const finalBannerText = await processWithGeminiAI(userInput);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px Poppins, sans-serif';
      ctx.textAlign = 'center';
      
      drawWrappedText(ctx, finalBannerText, 300, 510, 540, 32);

      placeholderText.style.display = 'none';
      canvas.style.display = 'block';
    }

    generateBtn.addEventListener('click', async () => {
      statusBox.innerText = "Status: Banner Processing...";
      setTimeout(async () => {
        await renderBanner();
        statusBox.innerText = "Status: Banner Taiyar Hai! 🎉";
      }, 400);
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (canvas.style.display !== 'none') {
        const link = document.createElement('a');
        link.download = 'AdSnap-HD-Banner.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        alert("Pehle kuch likho ya photo upload karke ➔ dabao!");
      }
    });
  </script>
</body>
</html>
